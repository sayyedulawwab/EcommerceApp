# Traefik in front of every environment on the server. Installed to /opt/edge by deploy/host/install-edge.sh.
# Routes come from the labels on the API containers (network "edge", deploy/app.compose.yml); shared TLS and
# header settings from dynamic/.
#
# Certificates: without any, Traefik serves its own self-signed default certificate (clients need -k, and the
# environment's variable group sets SMOKE_INSECURE=true). With a domain, add the certificate files to
# /opt/edge/certs and list them in dynamic/tls.yml.
name: edge

services:
  # Traefik reads the container list through this proxy instead of the Docker socket itself. The proxy
  # allows listing containers and nothing else: no POST, so no container can be started or changed.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: edge-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  traefik:
    image: traefik:v3.7.19
    container_name: traefik
    restart: unless-stopped
    depends_on: [socket-proxy]
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.tls=true
      - --entryPoints.websecure.http.middlewares=edge-headers@file,edge-retry@file
      - --accessLog=true
      - --log.level=INFO
      # No forwardedHeaders.trustedIPs: X-Forwarded-* sent by a client is replaced, so the API sees the real
      # client address (it trusts only this container's address, 172.29.0.2).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      edge:
        ipv4_address: 172.29.0.2 # = ForwardedHeaders__KnownProxies__0 in deploy/app.compose.yml
      socket: {}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  edge:
    external: true
  # Only Traefik and the proxy are on it, and it has no route out.
  socket:
    internal: true
