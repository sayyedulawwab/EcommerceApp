services:
  ecommerce-api:
    # Always a published image, tagged with the commit SHA (IMAGE_TAG has no default on purpose).
    image: ${IMAGE_REPOSITORY:-ghcr.io/sayyedulawwab}/ecommerce-api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    pull_policy: never

    environment:
      ASPNETCORE_ENVIRONMENT: Production

    restart: unless-stopped

  # One-off job: the EF Core migration bundle for the same commit. Run it before the API switches:
  #   docker compose ... --profile tools run --rm migrate
  # It only starts when asked for, so `docker compose up` never runs it.
  migrate:
    profiles: [tools]
    image: ${IMAGE_REPOSITORY:-ghcr.io/sayyedulawwab}/ecommerce-migrations:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    pull_policy: never
    environment:
      ConnectionStrings__Database: "Host=database-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
    networks:
      - ecommerce-network

  nginx:
    image: nginx:1.31.8-alpine

    container_name: nginx

    restart: unless-stopped

    depends_on:
      ecommerce-api:
        condition: service_healthy

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    external: true
    name: ecommerce-network
