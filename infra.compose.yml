name: ecommerce-infra

services:

  database-postgres:
    image: postgres:18.6
    container_name: database-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

    ports:
      - "5432:5432"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ecommerce-network

  cache-redis:
    image: redis:8.10.3

    container_name: cache-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ecommerce-network
  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "14318:4318" # OTLP HTTP
      - "9464:9464" # Prometheus metrics
      - "13133:13133" # Health check
    volumes:
      - ./otel/otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    networks:
      - ecommerce-network

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    # Data in named volumes, mounted on folders the image already owns under its own user: Docker gives a new
    # volume that folder's owner, so no service needs root and no host folder needs a chown (on Linux, a
    # bind-mounted folder that doesn't exist yet is created owned by root, and the service can't write to it).
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
    command: -config.file=/etc/loki/config.yml
    networks:
      - ecommerce-network

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  tempo:
    image: grafana/tempo:3.1.1
    container_name: tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

volumes:
  postgres-data:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge
    # Fixed subnet: the API trusts X-Forwarded-For only from this range (TRUSTED_PROXY_NETWORK in docker-compose.yml).
    ipam:
      config:
        - subnet: 172.28.0.0/24