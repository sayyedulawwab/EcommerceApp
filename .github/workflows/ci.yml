name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Standard property for CI builds: deterministic paths in the build output.
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EcommerceApp.slnx

      - name: Build
        run: dotnet build EcommerceApp.slnx --no-restore --configuration Release

      # Testcontainers starts PostgreSQL in the runner's Docker for the integration tests.
      - name: Test
        run: dotnet test EcommerceApp.slnx --no-build --configuration Release
