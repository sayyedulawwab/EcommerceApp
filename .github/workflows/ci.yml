name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only, no secrets: pull requests (including from forks) run here, on GitHub's hosted runners, never on
# the server. main only accepts a merge once build-and-test passed; the Azure DevOps pipeline
# (azure-pipelines.yml) then builds the images on the server and deploys them.
permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Standard property for CI builds: deterministic paths in the build output.
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EcommerceApp.slnx

      - name: Build
        run: dotnet build EcommerceApp.slnx --no-restore --configuration Release

      # The fast tests run first, so a broken rule fails the run before any container starts.
      - name: Unit and architecture tests
        run: |
          dotnet test --project Ecommerce.Domain.UnitTests --no-build --configuration Release
          dotnet test --project Ecommerce.Application.UnitTests --no-build --configuration Release
          dotnet test --project Ecommerce.ArchitectureTests --no-build --configuration Release

      # Testcontainers starts PostgreSQL and Redis in the runner's Docker for the integration tests.
      - name: Integration tests
        run: dotnet test --project Ecommerce.IntegrationTests --no-build --configuration Release

  # Proves on every pull request that both images still build. Nothing is pushed.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --file Ecommerce.API/Dockerfile --tag ecommerce-api:ci .

      - name: Build migration bundle image
        run: docker build --file deploy/migrations.Dockerfile --tag ecommerce-migrations:ci .
